name: Production canary

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canary
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check production, retry once to confirm failures
        shell: bash
        run: |
          if node scripts/monitor-site.mjs; then
            exit 0
          fi
          sleep 30
          node scripts/monitor-site.mjs
