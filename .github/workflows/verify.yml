name: Verify site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:3100
      WORKING_DEMO_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Validate the production build
        shell: bash
        run: |
          pnpm run start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/iceratops-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 50 "$RUNNER_TEMP/iceratops-server.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 "$BASE_URL/" > /dev/null; then
              pnpm run validate:site
              node scripts/monitor-site.mjs
              exit 0
            fi
            sleep 1
          done
          tail -n 50 "$RUNNER_TEMP/iceratops-server.log"
          exit 1
